services:
  - type: web
    name: wish-map-web
    runtime: static
    branch: main
    buildCommand: npm ci && npx expo export --platform web --clear
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_NO_DOTENV
        value: "1"
      - key: EXPO_PUBLIC_API_URL
        value: https://api.wishmap.kr
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
